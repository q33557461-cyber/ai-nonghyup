/* AI첫걸음 v06 디자인 — 김상무 색(아이보리·먹·금·진녹)은 그대로, 김상무님 요청(11-16)으로 이 앱만 둥근 모서리·입체 그림자·은은한 그라데이션을 씀 */
:root{
  --bg:#F3F4EE; --bg2:#E9EBE2; --surface:#FFFFFF; --soft:#F8F8F4;
  --ink:#1D231E; --ink2:#465045; --ink3:#626A60;
  --gold:#D8AA43; --goldh:#E6BE5E; --goldd:#A97E22;
  --green:#173D27; --green2:#21503A; --green3:#2F6E4D; --leaf:#4E9E6B; --mint:#E3EEE6; --mint2:#D2E3D7;
  --line:rgba(29,35,30,.10); --line2:rgba(29,35,30,.18);
  --r-xl:26px; --r-lg:22px; --r:14px; --r-sm:10px;
  --sh1:0 1px 2px rgba(20,45,30,.06),0 4px 10px rgba(20,45,30,.07);
  --sh2:0 2px 4px rgba(20,45,30,.07),0 12px 26px rgba(20,45,30,.12);
  --sh3:0 4px 10px rgba(20,45,30,.08),0 22px 50px rgba(20,45,30,.18);
  --key:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(29,35,30,.08);
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --wrap:1120px; --gut:20px; --top:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;caret-color:var(--green3)}
::selection{background:rgba(216,170,67,.35);color:var(--ink)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gut)}
.muted{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.emo{font-family:var(--emoji);font-style:normal;line-height:1}

/* ---------- 머리 ---------- */
.top{position:sticky;top:0;z-index:20;color:#fff;background:rgba(23,61,39,.94);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(255,255,255,.06),0 6px 20px rgba(10,30,18,.18)}
.top .wrap{display:flex;align-items:center;gap:20px;height:var(--top)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.appicon{display:block;width:34px;height:34px;flex:none;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.12)}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand small{font-size:13px;color:rgba(246,246,241,.74);font-weight:500;white-space:nowrap}
.badge{display:none;margin-left:auto;font-size:12px;font-weight:700;color:var(--green);background:linear-gradient(180deg,#F1D58F,var(--gold));padding:4px 10px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
nav.tabs{margin-left:auto;display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(0,0,0,.18);box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.08)}
nav.tabs a{display:flex;align-items:center;gap:7px;text-decoration:none;font-size:15px;font-weight:700;color:rgba(246,246,241,.82);padding:7px 15px;border-radius:999px;transition:background .2s var(--ease),color .2s,transform .12s,box-shadow .2s}
nav.tabs a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a:hover{color:#fff;background:rgba(255,255,255,.08)}
nav.tabs a:active{transform:translateY(1px)}
nav.tabs a[aria-current]{color:var(--green);background:linear-gradient(180deg,#FFFFFF,#E9EFE8);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(23,61,39,.12),0 3px 8px rgba(0,0,0,.25)}

5,30,.22))}
.mascot.hop{animation:hop .6s var(--ease)}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-8px) scale(1.04,.96)}60%{transform:translateY(0) scale(.98,1.03)}100%{transform:none}}
.guide{display:flex;align-items:flex-end;gap:10px;margin:0 0 18px}
.bubble{position:relative;margin:0 0 6px;padding:11px 15px;background:#fff;border-radius:16px 16px 16px 6px;box-shadow:var(--sh2);font-size:15px;font-weight:600;line-height:1.5;color:var(--ink)}
.bubble small{display:block;font-size:12px;font-weight:700;color:var(--green3);margin-bottom:1px}
.bubble b{color:var(--green)}
.gpop{position:fixed;left:14px;right:14px;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:flex-end;gap:8px;pointer-events:none;opacity:0;transform:translateY(10px) scale(.98);transition:opacity .25s var(--ease),transform .35s var(--ease)}
.gpop.show{opacity:1;transform:none}
.gpop .mascot{width:54px;height:54px}
.gpop .bubble{margin:0 0 4px;font-size:14px;box-shadow:var(--sh3)}

/* ---------- 처음 화면 ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:44px 0 84px;background:radial-gradient(80% 70% at 90% 0%,rgba(78,158,107,.42),transparent 62%),radial-gradient(55% 60% at 0% 100%,rgba(216,170,67,.14),transparent 60%),linear-gradient(180deg,#173D27 0%,#10301E 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(110deg,transparent 35%,#000 80%);mask-image:linear-gradient(110deg,transparent 35%,#000 80%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(31px,5.4vw,52px);line-height:1.14;font-weight:900;letter-spacing:-.035em;margin:0 0 14px}
.hero h1 .hl{color:var(--goldh)}
.hero p.lead{font-size:17px;color:rgba(246,246,241,.84);margin:0 0 26px;max-width:32em}
.hero p.lead b{color:#fff}
.search{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);height:60px;padding:0 8px 0 18px;max-width:600px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 -3px 0 rgba(29,35,30,.06)}
.search svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--green3);stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;height:100%}
.search input::placeholder{color:#7D8379}
.search:focus-within{box-shadow:0 12px 30px rgba(0,0,0,.28),0 0 0 4px rgba(216,170,67,.55)}
.results{list-style:none;margin:10px 0 0;padding:6px;max-width:600px;background:#fff;border-radius:16px;box-shadow:var(--sh3)}
.results a{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-radius:11px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus-visible{background:var(--mint)}
.results small{margin-left:auto;color:var(--ink3);font-size:13px;white-space:nowrap}
.results .none{padding:12px 14px;color:var(--ink2)}
.results .none a{display:inline;padding:0;text-decoration:underline;color:var(--green);font-weight:700}
.hero .results{color:var(--ink)}

/* 떠 있는 질문 카드 미리보기 */
.stage{position:relative}
.cards{position:relative;min-height:290px;perspective:1100px}
.pv{position:absolute;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.34),0 8px 18px rgba(0,0,0,.18)}
.pv-q{top:6px;left:0;width:82%;transform:rotateY(-13deg) rotateX(7deg) rotateZ(-2deg);transform-origin:left center;overflow:hidden}
.pv-top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#1E4A31,#173D27);color:#fff;font-size:13px;font-weight:700}
.pv-top .appicon{width:20px;height:20px;border-radius:6px}
.pv-copy{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink);background:linear-gradient(180deg,var(--goldh),var(--gold));padding:3px 10px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.pv-body{padding:12px 16px 14px;font-size:13.5px;line-height:1.55}
.pv-body i{display:inline-block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--green);background:var(--mint);padding:0 7px;border-radius:6px;margin-top:6px}
.pv-body p{margin:3px 0 0;color:var(--ink2)}
.pv-a{right:0;bottom:8px;width:64%;padding:14px 16px;transform:rotateY(-13deg) rotateX(7deg) rotateZ(1.5deg) translateZ(40px);background:linear-gradient(180deg,#FFFFFF,#F2F5EF);font-size:13.5px;line-height:1.55}
.pv-a .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#fff;background:var(--green3);padding:2px 9px;border-radius:999px;margin-bottom:6px}
.pv-a p{margin:0;color:var(--ink2)}
.stage .guide{position:relative;z-index:3;margin:-4px 0 0}
.stage .guide .mascot{width:92px;height:92px;margin-bottom:-6px}
.stage .guide .bubble{font-size:14px}

.steps3{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-44px}
.steps3 div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r-lg);padding:16px 18px;font-weight:700;font-size:15px;box-shadow:var(--sh2)}
.steps3 .emo{margin-left:auto;font-size:22px}

const ADDR_END="(?!\\d|\\s?(?:시간|시|분|명|개월|개|일|회|번(?!길)|부(?!근)|건|층|석|원|년|월|주|차|곳|대|장|권|통|세대|세|살|마리|톤|평|배|농가|가구|호|인|포|상자|박스|필지|마지기|단계|차례|가지|쪽|페이지|문항|항목|개소|회차|조|팀|반|등|위|ha|㎡|km|kg|m|%))";
const PII=[
 ["이메일",/[\w.+-]+@[\w-]+\.[\w.-]+/g],
 ["주민등록번호",/(?<!\d)\d{6}\s*-?\s*[1-8]\d{6}(?!\d)/g,okRRN],

 ["전화번호",/(?<!\d)\(?0(?:2|[3-6][1-5]|70|80|50\d)\)?\s*[-.)/]?\s*\d{3,4}\s*[-./]?\s*\d{4}(?!\d)/g],
 ["계좌·카드 번호",/(?<!\d)\d{2,6}(?:-\d{2,6}){2,4}(?!\d)/g,m=>m.replace(/\D/g,"").length>=10], /* 날짜 2026-11-09 같은 것은 통과 */
 ["계좌·카드 번호",/(?<=(?:계좌|카드|통장)(?:번호)?\s*[:：]?\s*)\d{10,16}(?!\d)/g],

 /* 주소(v03): 오작동을 줄이려고 '시·군·구·읍·면 + 도로명 + 번호', '읍·면 + ○○리 + 번지', '○○번길 번호', '…번지'만 잡는다. 이름 가리기는 보류 */
 ["주소",new RegExp("(?<![가-힣])("+CITY+"|[가-힣]{1,8}(?:군|구|읍|면))\\s+(?:([가-힣]{1,8}(?:구|읍|면|동))\\s+)?([가-힣0-9]{1,12}(?:로|길))\\s?\\d{1,4}(?:-\\d{1,4})?"+ADDR_END,"g"),(m,a,b,r)=>!ADDR_STOP.test(a)&&!IF_END.test(a)&&!(b&&(ADDR_STOP.test(b)||IF_END.test(b)))&&!ROAD_STOP.test(r)],
 ["주소",new RegExp("(?<![가-힣])[가-힣0-9]{1,12}(?:로|길)\\s?\\d{1,4}번?길\\s?\\d{1,4}(?:-\\d{1,4})?(?!\\d)","g")],
 ["주소",new RegExp("(?<![가-힣])([가-힣]{1,8}(?:읍|면))\\s*([가-힣]{1,6}리)\\s*(?:산\\s?)?\\d{1,5}(?:-\\d{1,5})?"+ADDR_END,"g"),(m,a,r)=>!ADDR_STOP.test(a)&&!IF_END.test(a)&&!RI_STOP.test(r)],
 ["주소",new RegExp("(?<![가-힣])[가-힣]{1,8}(?:리|동|가)\\s*(?:산\\s?)?\\d{1,5}(?:-\\d{1,5})?\\s?번지","g")]

function scrub(text){
  const found=[];let t=text||"";
  for(const [name,re,ok] of PII){
    t=t.replace(re,(...a)=>{const m=a[0];
      if(ok&&!ok(...a)) return m;
      if(!found.includes(name)) found.push(name); return "[지움]";
    });
  }
  return {text:t,found};
}

function rawPrompt(o){
  /* o: {task, out, aud, sit, myDept, customName, nh} */
  const t=o.task, out=OUTS[o.out], aud=AUDS[o.aud];

  const rules=["위 상황에 없는 숫자·날짜·금리·규정·연락처·담당자는 지어내지 말고 [확인 필요]로 표시해 주세요."];
  const own=t&&(o.sit||"").trim()&&(o.sit||"").trim()!==t.s; /* 상황을 직접 고침 → 확정해 적은 값이 있을 수 있음 */
  const keep=/넣지 말고|말하지 말고|^정하지 않은|^정해지지 않은/;
  const soft=r=>!own||keep.test(r)?r:r.replace(/(숫자를 )?(지어내지 말고 )?(\[[^\]]+\](?: 자리)?로|빈칸으로|비워) (두세요|두고|표시해 주세요)/g,(m,a,b,p,v)=>`${a?"숫자는 ":""}상황에 적혀 있으면 그대로 쓰고, 없으면 ${b||""}${p} ${v}`);
  if(t&&t.c) rules.push(soft(t.c));
  const fo=t&&t.f&&t.f[o.out];const ord=!!(fo&&/순서로/.test(fo)&&/순서로/.test(out.how)); /* 순서 지시가 둘이면 AI가 헷갈림 → 업무 쪽 순서 하나만 */
  if(fo&&!ord) rules.push(soft(fo));

  app.innerHTML=`<div class="wrap page">

  <h1>${custom?emo("✍️")+"내 업무로 질문 만들기":esc(t.n)}</h1>
  <p class="lead">${custom?"업무 이름과 상황을 적으면 오른쪽에 질문이 만들어집니다.":needSrc?"상황을 내 일로 바꾸고, <b>공개해도 되는 원문</b>을 붙인 뒤 [질문 복사]를 누르세요.":"질문은 이미 만들어져 있어요. <b>상황만 내 일로 바꾸고</b> [질문 복사]를 누르세요."}</p>
  ${guide("")}
  <div class="two">
    <div>
      ${custom?`<div class="field"><label class="lab" for="nm">${N()}무슨 업무인가요? <span class="muted">부서 · 업무</span></label>
        <input class="t" id="nm" value="${esc(st.name)}" placeholder="예: 경제과 · 영농자재 배송 일정 안내"></div>`:""}
      <div class="field"><label class="lab" for="sit">${N()}어떤 상황인가요?${emo("✏️")}</label>
        <textarea id="sit" placeholder="누구에게 무엇을 안내·부탁하는지 한두 줄로. 이름·번호는 빼고 적어 주세요.">${esc(st.sit)}</textarea>
        ${custom?"":`<div class="minor"><button class="linkbtn" id="clrSit" type="button">예시 지우기</button><button class="linkbtn" id="exSit" type="button">예시 다시 넣기</button></div>`}
        <div class="warn" id="pii" role="status" hidden></div>
        <p class="safe"><b>실제 이름·번호·내부 자료는 쓰지 마세요.</b> 이름은 자동으로 가려지지 않아요.</p>
        <p class="hint">${custom?"":"지금 적힌 글은 예시예요. "}정하지 않은 날짜·금액은 그냥 비워 두면 AI가 [확인 필요]로 표시합니다.</p></div>
      ${needSrc?`<div class="field"><label class="lab" for="src">${N()}원문 붙여 넣기 <span class="muted">공개해도 되는 글만</span></label>
        <textarea id="src" placeholder="예: 농업기술센터 누리집에 공개된 안내 글. 내부 문서·개인정보는 넣지 마세요.">${esc(st.src)}</textarea>
        <p class="hint">비워 두면 AI가 완성본을 지어내지 않고 <b>원문부터 달라고</b> 합니다. 그때 같은 대화창에 원문을 붙여 넣으세요.</p></div>`:""}
      <div class="field"><div class="lab">${N()}무엇을 받을까요?${emo("📄")}</div>
        <div class="chips" id="outs">${Object.entries(OUTS).map(([k,v])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${st.out===k}">${v.n}</button>`).join("")}</div>
        <label class="toggle" id="nhw"${NH_OUTS.includes(st.out)?"":" hidden"}><input type="checkbox" id="nh"${st.nh?" checked":""}><div><b>농협 문서 기호로 쓰게 하기</b><span>1. → □ → ○ → ※, 절차는 ① ② ③</span></div></label></div>
      <div class="field"><div class="lab">${N()}누가 읽나요?${emo("👀")}</div>
        <div class="chips" id="auds">${Object.entries(AUDS).map(([k,v])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${st.aud===k}">${v.n}</button>`).join("")}</div></div>
      ${custom?"":`<details class="more"><summary>우리 조합에서는 부서 이름이 달라요 (선택)</summary><div class="in">
        <input class="t" id="my" value="${esc(st.my)}" placeholder="예: 경제과 자재계"><p class="hint">이 기기에만 기억해요.</p></div></details>`}
    </div>
    <div>
      <div class="card" id="panel">
        <div class="cardhead">${APPICON}<b>AI에게 보낼 질문</b><small id="len"></small></div>
        <pre class="prompt" id="pr" aria-live="polite"></pre>
        <div class="cardfoot"><button class="copy" id="cp" type="button">${ICON.copy}질문 복사</button><span class="done" id="ok" role="status"></span></div>
      </div>
      <div class="next"><h3><span class="num">${ICON.go}</span>복사한 다음, 쓰는 AI를 열고 붙여 넣기${emo("📲")}</h3>
        <div class="ais">${AIS.map(([nm,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${nm}${ICON.out}</a>`).join("")}</div>
        <p class="hint">소속 조합에서 쓰도록 허용한 AI를 쓰세요. 휴대폰은 입력칸을 길게 눌러 [붙여넣기].</p></div>
      <div class="next"><h3>답을 받은 뒤에는 AI와 대화를 이어 가세요${emo("💬")}</h3>
        <p class="flow" style="margin:0 0 10px"><b>처음 시작만 앱의 도움을 받으세요.</b> 그다음은 AI 안에서 "더 짧게 해 줘"처럼 편하게 말하며 이어 가시면 됩니다. 말이 막힐 때만 아래 문장을 눌러 복사하세요.</p>
        <ul class="follows" id="fl"></ul>
        <p class="hint">누르면 복사돼요. 같은 대화창에 붙여 넣으세요.</p></div>
      <div class="next"><h3>쓰기 전에 사람이 확인할 것${emo("🔎")}</h3>
        <ol class="checks"><li><b>숫자·날짜·규정</b>이 맞는지</li><li><b>[확인 필요]</b> 자리를 모두 채웠는지</li><li>실제 이름·번호가 들어가지 않았는지</li></ol></div>
    </div>
  </div></div>`;
  const pr=$("#pr"),ok=$("#ok");let copied="";
  /* 새싹이가 지금 할 일을 알려 줌 */
  const guideMsg=found=>{
    if(custom&&!st.name.split("·").pop().trim())return "먼저 <b>무슨 업무인지</b> 적어 주세요 ✏️";
    if(!st.sit.trim())return "상황을 <b>한 줄만</b> 적어 주세요 🙂 누구에게 무엇을 할지면 돼요.";
    if(found&&found.length)return "번호처럼 보이는 건 제가 <b>[지움]</b>으로 가렸어요 🙈 이름은 직접 빼 주세요.";
    if(copied&&copied===pr.dataset.t)return "복사 완료! 🎉 이제 <b>AI 앱을 열고 붙여 넣으세요.</b> 그다음은 AI와 대화하시면 돼요.";
    if(t&&st.sit===t.s)return needSrc?"예시 상황을 <b>내 일로 바꾸고</b>, 공개해도 되는 원문이 있으면 붙여 주세요 📄":"지금 적힌 건 예시예요. <b>상황만 내 일로 바꿔</b> 보세요 ✏️";
    return "좋아요! 👍 이제 <b>[질문 복사]</b>를 눌러 주세요.";
  };
  let ready=false;
  const render=txt=>{pr.innerHTML=esc(txt).replace(/^(\[[^\]\n]+\])$/gm,'<span class="h">$1</span>');$("#len").textContent=txt.length.toLocaleString()+"자"};
  const drawFollows=()=>{$("#fl").innerHTML=follows(st.out).map(([k,v],i)=>`<li><button type="button" data-i="${i}"><span>${esc(k)}</span><small>복사</small></button></li>`).join("")};
  const draw=()=>{
    const r=askPrompt({task:t,out:st.out,aud:st.aud,sit:st.sit,myDept:st.my,customName:st.name,nh:st.nh,src:st.src});
    if(pr.dataset.t!==r.text){pr.dataset.t=r.text;render(r.text);
      if(copied&&copied!==r.text){ok.textContent="질문이 바뀌었어요. 다시 [질문 복사]를 눌러 주세요.";ok.classList.add("stale")}}
    const f=r.found;const w=$("#pii");w.hidden=!f.length;
    if(f.length)w.textContent=`${f.join(", ")}로 보이는 것을 질문에서 [지움]으로 바꿨어요. 사람 이름은 가려지지 않으니 직접 빼 주세요.`;
    $("#nhw").hidden=!NH_OUTS.includes(st.out);
    say(guideMsg(f),ready);
  };
  const chipGroup=(sel,key)=>$(sel).addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st[key]=b.dataset.k;$(sel).querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));if(key==="out")drawFollows();draw()});
  chipGroup("#outs","out");chipGroup("#auds","aud");
  $("#sit").addEventListener("input",e=>{st.sit=e.target.value;draw()});
  if($("#src"))$("#src").addEventListener("input",e=>{st.src=e.target.value;draw()});
  if($("#clrSit"))$("#clrSit").onclick=()=>{st.sit="";$("#sit").value="";$("#sit").focus();draw()};
  if($("#exSit"))$("#exSit").onclick=()=>{st.sit=t.s;$("#sit").value=t.s;draw()};
  if($("#my"))$("#my").addEventListener("input",e=>{st.my=e.target.value;const o=mem.get();const my=o.my&&typeof o.my==="object"?o.my:{};if(st.my.trim())my[t.d]=st.my.trim();else delete my[t.d];o.my=my;mem.set(o);draw()});
  $("#nh").addEventListener("change",e=>{st.nh=e.target.checked;draw()});
  if($("#nm"))$("#nm").addEventListener("input",e=>{st.name=e.target.value;draw()});
  $("#fl").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const v=follows(st.out)[+b.dataset.i][1];const good=await copyText(v);
    $("#fl").querySelectorAll("button").forEach(x=>{x.classList.remove("ok");x.querySelector("small").textContent="복사"});
    $("#fl").querySelectorAll(".fbtext").forEach(x=>x.remove());
    b.classList.add("ok");b.querySelector("small").textContent=good?"복사했어요":"아래 글을 길게 눌러 복사";
    if(!good)b.insertAdjacentHTML("afterend",`<p class="fbtext">${esc(v)}</p>`); /* P2-6: 실패하면 실제 문장을 펼침 */
    say(good?"같은 대화창에 붙여 넣으면 돼요 💬":"아래 글을 길게 눌러 복사해 주세요 🙏",true)});
  /* P2-5: 비어 있는 채로 복사하지 않기 */
  const blank=()=>{if(custom&&!st.name.split("·").pop().trim())return ["#nm","업무 이름을 먼저 적어 주세요. (예: 영농자재 배송 일정 안내)"];
    if(!st.sit.trim())return ["#sit","상황을 한 줄이라도 적어 주세요. 누구에게 무엇을 하려는지면 됩니다."];return null};
  const doCopy=async()=>{const b=blank();if(b){ok.classList.add("stale");ok.textContent=b[1];$(b[0]).focus();say(guideMsg(),true);return "blank"}
    const txt=pr.dataset.t;const good=await copyText(txt);if(good)copied=txt;ok.classList.remove("stale");
    ok.textContent=good?"복사했어요. 이제 AI 대화창에 붙여 넣으세요.":"복사가 안 됐어요. 질문을 길게 눌러 직접 복사해 주세요.";
    if(good){const cp=$("#cp");cp.classList.add("copied");cp.innerHTML=ICON.check+"복사했어요";clearTimeout(cp._t);cp._t=setTimeout(()=>{cp.classList.remove("copied");cp.innerHTML=ICON.copy+"질문 복사"},1800)}
    say(good?guideMsg():"복사가 안 됐어요 😥 질문을 <b>길게 눌러</b> 직접 복사해 주세요.",true);return good};
  $("#cp").addEventListener("click",doCopy);
  drawFollows();draw();ready=true;
  mobileBar(doCopy);
}
function mobileBar(doCopy){
  const bar=$("#mbar");bar.hidden=false;document.body.classList.add("hasbar");
  const v=$("#mView"),c=$("#mCopy");
  v.onclick=()=>{const el=$("#panel");const head=$(".top").offsetHeight;window.scrollTo({top:scrollY+el.getBoundingClientRect().top-head-8,behavior:"auto"})};
  c.onclick=async()=>{const r=await doCopy();c.textContent=r==="blank"?"먼저 적어 주세요":r?"복사했어요":"복사 안 됨";c.classList.toggle("copied",r===true);
    clearTimeout(c._t);c._t=setTimeout(()=>{c.textContent="질문 복사";c.classList.remove("copied")},2200)};
}

     <li>이 앱은 AI에 직접 보내지 않습니다. 질문·상황 글은 저장하지 않고, 우리 조합 부서 이름과 최근 업무 3개만 이 기기에 기억합니다.</li>

window.__AI={DEPTS,TASKS,OUTS,AUDS,makePrompt,askPrompt,scrub,findAll,follows};
route();
