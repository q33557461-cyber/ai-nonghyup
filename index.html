<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김상무의 AI농협</title>
<meta name="description" content="농협 직원을 위한 가상 교육 공간. 부서와 업무를 고르면 AI에게 보낼 질문과 엑셀 수식이 바로 나와요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ivory:#F6F6F1; --ivory2:#ECECE4; --ivory3:#E1E1D7;
  --ink:#20251F; --ink2:#454B43; --ink3:#61665E;
  --gold:#D8AA43; --goldt:#F6EDD6; --goldd:#8A6513;
  --green:#173D27; --greent:#E3EBE4; --greenh:#D5E2D8;
  --white:#FFFFFF; --line:#CDCEC4; --grid:#DADAD2; --head:#EEEEE8;
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --mono:Consolas,"D2Coding","Malgun Gothic",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:break-word}
::selection{background:var(--greenh)}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
code,.mono{font-family:var(--mono);letter-spacing:0}
a{color:var(--green);font-weight:700;text-underline-offset:3px}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:var(--ivory);border-bottom:1px solid var(--line)}
.topin{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:7px;height:28px;background:var(--gold)}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.brand small{font-size:12px;font-weight:700;color:var(--ink3);border:1px solid var(--line);padding:1px 8px;border-radius:999px;background:var(--white);letter-spacing:0}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--ink2);font-weight:700;font-size:15.5px;padding:7px 12px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--green);border-bottom-color:var(--green)}
main{max-width:1080px;margin:0 auto;padding:26px 20px 110px}
.foot{max-width:1080px;margin:0 auto;padding:0 20px 40px;font-size:13.5px;color:var(--ink3)}

/* 공통 */
h1{font-size:32px;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.035em}
h2{font-size:24px;line-height:1.3;margin:0 0 6px;font-weight:800;letter-spacing:-.03em}
h3{font-size:18px;margin:0 0 8px;font-weight:800}
.now{display:flex;gap:10px;align-items:flex-start;background:var(--greent);border-left:5px solid var(--green);padding:10px 14px;margin:14px 0 18px;font-weight:600;font-size:16px}
.now b{flex:none;background:var(--green);color:var(--white);font-size:13px;padding:1px 8px;margin-top:2px;letter-spacing:0}
.muted{color:var(--ink3);font-size:15px}
.crumb{font-size:14.5px;color:var(--ink3);margin-bottom:6px}
.crumb a{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--green);background:var(--green);color:var(--white);font-weight:800;font-size:17px;padding:11px 20px;cursor:pointer;text-decoration:none}
.btn:hover{background:#0F2D1C}
.btn.sub{background:var(--white);color:var(--green)}
.btn.sub:hover{background:var(--greent)}
.btn.sm{font-size:15px;padding:7px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:15.5px;font-weight:700;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--white);cursor:pointer}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--green);color:var(--white);border-color:var(--green)}
.tag{display:inline-block;font-size:12.5px;font-weight:800;padding:1px 8px;letter-spacing:0;vertical-align:2px}
.tag.q{background:var(--greent);color:var(--green)}
.tag.x{background:var(--goldt);color:var(--goldd)}

/* 첫 화면 */
.hello{font-size:17px;font-weight:700;color:var(--green);margin:0 0 4px}
.search{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--ink);padding:0 14px;margin:16px 0 6px}
.search:focus-within{outline:3px solid var(--green)}
.search svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink3);stroke-width:2}
.search input{border:0;outline:0;background:transparent;padding:14px 0;width:100%;font-size:18px}
.results{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line);background:var(--white)}
.results li+li{border-top:1px solid var(--grid)}
.results a{display:flex;gap:10px;align-items:center;padding:12px 14px;text-decoration:none;color:var(--ink);font-weight:700}
.results a:hover{background:var(--greent)}
.results small{font-weight:500;color:var(--ink3);margin-left:auto;font-size:14px;text-align:right}
.sec{margin-top:26px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sechead h2{font-size:20px;margin:0}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.dept{text-align:left;background:var(--white);border:1px solid var(--line);padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:82px}
.dept:hover{border-color:var(--green)}
.dept b{font-size:17px;font-weight:800}
.dept span{font-size:14px;color:var(--ink3);line-height:1.4}
.dept[aria-pressed="true"]{border:2px solid var(--green);background:var(--greent)}
.dept.xl{border-color:var(--gold);background:var(--goldt)}
.dept.xl:hover{border-color:var(--goldd)}
.tasklist{margin-top:14px;background:var(--white);border:2px solid var(--green);padding:16px}
.tasklist h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0 12px}
.task{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:10px 12px;font-weight:700;background:var(--ivory)}
.task:hover{border-color:var(--green);background:var(--greent)}
.task small{display:block;font-weight:500;color:var(--ink3);font-size:13.5px}

/* 질문 만들기 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.field{margin-bottom:18px}
.field>label,.field>.lab{display:flex;gap:8px;align-items:baseline;font-weight:800;font-size:17px;margin-bottom:8px}
.n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--ink);color:var(--white);font-size:14px;font-weight:800;letter-spacing:0}
.field .muted{font-weight:500}
textarea,input.t{width:100%;border:1px solid var(--ink3);background:var(--white);padding:10px 12px;font-size:16.5px;line-height:1.55;border-radius:0}
textarea{min-height:104px;resize:vertical}
.warn{margin:8px 0 0;background:var(--goldt);border-left:4px solid var(--gold);padding:8px 12px;font-size:15px;font-weight:600}
.panel{background:var(--white);border:2px solid var(--ink);position:sticky;top:76px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--head)}
.panelhead b{font-size:16px}
.panelhead em{font-style:normal;font-size:13px;font-weight:800;color:var(--goldd);background:var(--goldt);padding:2px 8px;letter-spacing:0}
pre.prompt{margin:0;padding:14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--font);font-size:15.5px;line-height:1.65;max-height:52vh;overflow:auto}
.panelfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.done{font-weight:700;color:var(--green);font-size:15px}
.after{margin-top:14px;border:1px solid var(--line);background:var(--white);padding:14px 16px}
.after ol{margin:6px 0 0;padding-left:22px}
.after li{margin:3px 0}
.mbar{display:none}

/* 엑셀 */
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.xcard{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--white);border:1px solid var(--line);padding:14px 16px;min-height:118px}
.xcard:hover{border-color:var(--goldd)}
.xcard q{font-weight:800;font-size:17px;quotes:none}
.xcard span{font-size:14px;color:var(--ink3)}
.xcard code{margin-top:auto;font-size:13.5px;color:var(--goldd);font-weight:700}
.xcard.other{border-style:dashed;background:transparent}
.scene{font-size:19px;font-weight:700;margin:2px 0 4px}
.sheetwrap{overflow-x:auto;border:1px solid var(--grid);background:var(--white);max-width:100%}
table.sheet{border-collapse:collapse;font-size:14.5px;min-width:100%}
.sheet th,.sheet td{border:1px solid var(--grid);padding:4px 9px;white-space:nowrap;text-align:left}
.sheet thead th,.sheet tbody th{background:var(--head);color:var(--ink3);font-weight:600;font-size:12.5px;text-align:center;letter-spacing:0}
.sheet tbody th{width:34px}
.sheet td.res{background:var(--goldt);font-weight:800}
.sheet td.nr{text-align:right;font-family:var(--mono);letter-spacing:0}
.sheet td.hd{font-weight:700;background:#F7F7F2}
.swipe{font-size:13.5px;color:var(--ink3);margin:6px 0 0}
.fit{background:var(--white);border:1px solid var(--line);padding:14px 16px}
.fit .line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0;font-weight:600}
.fit select,.fit input{border:1px solid var(--ink3);background:var(--white);padding:5px 6px;font-weight:800;font-size:16.5px;border-radius:0}
.fit input{width:84px}
.fit select{min-width:60px}
.fit input.w{width:150px}
.fit .hdr{margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.fit .hdr label{display:block;font-weight:700;margin-bottom:6px}
.fit .hdr input{width:100%;font-weight:600}
.fit .hdr p{margin:6px 0 0}
.confirm{border:2px solid var(--goldd);background:var(--goldt);padding:12px 16px}
.confirm ul{margin:8px 0;padding-left:20px}
.confirm li{margin:3px 0}
.confirm p{margin:6px 0 10px}
.go2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.go{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--white);border:2px solid var(--ink);padding:14px 16px}
.go:hover{border-color:var(--green)}
.go b{font-size:19px;font-weight:800}
.go span{font-size:14.5px;color:var(--ink3)}
.go.xl{border-color:var(--goldd);background:var(--goldt)}
@media (max-width:600px){.go2{grid-template-columns:1fr}}
.out{margin-top:14px;background:var(--white);border:2px solid var(--ink)}
.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;background:var(--head);border-bottom:1px solid var(--line)}
.formula code{font-size:17px;font-weight:700;overflow-wrap:anywhere;flex:1 1 280px}
.how{margin:0;padding:12px 16px 4px 38px}
.how li{margin:6px 0}
.check{margin:4px 16px 14px;background:var(--greent);padding:10px 12px;font-size:15.5px}
.check b{color:var(--green)}
.err{padding:14px 16px;font-weight:700;background:var(--goldt);border-left:5px solid var(--gold)}
details.more{margin-top:14px;border:1px solid var(--line);background:var(--white)}
details.more summary{padding:12px 16px;font-weight:800;color:var(--green);cursor:pointer}
details.more .in{padding:0 16px 16px}
.alt{font-size:14.5px;margin:0 16px 14px;color:var(--ink2)}
.alt code{font-size:14px;overflow-wrap:anywhere}

/* 안내 */
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.box{background:var(--white);border:1px solid var(--line);padding:16px 18px}
.box ul{margin:6px 0 0;padding-left:20px}
.box li{margin:3px 0}
.soon{color:var(--ink3)}

@media (max-width:860px){
  .two{grid-template-columns:1fr}
  .panel{position:static}
  pre.prompt{max-height:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ivory);border-top:1px solid var(--line)}
  .mbar .btn{flex:1;padding:11px 10px}
  body.hasbar .foot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){
  h1{font-size:26px}
  h2{font-size:21px}
  main{padding-top:18px}
  .topin{padding:8px 16px}
  .brand small{display:none}
  nav.tabs{margin-left:0;width:100%}
  nav.tabs a{padding:6px 9px;font-size:15px}
  .depts{grid-template-columns:1fr 1fr}
  .dept{min-height:76px;padding:11px 12px}
  .dept b{font-size:16px}
  .dept span{font-size:13px}
  .search input{font-size:17px}
}
</style>

<header class="top">
  <div class="topin">
    <a class="brand" href="#/"><span class="mark"></span><b>김상무의 AI농협</b><small>가상 교육 공간</small></a>
    <nav class="tabs" aria-label="메뉴">
      <a href="#/" data-nav="home">처음</a>
      <a href="#/ask" data-nav="ask">AI 질문 만들기</a>
      <a href="#/xl" data-nav="xl">엑셀 수식</a>
      <a href="#/about" data-nav="about">안내</a>
    </nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<p class="foot">농협의 공식 서비스가 아닌 개인 교육용 시안입니다. 실제 고객·조합원 이름, 전화번호, 계좌, 내부 숫자는 넣지 마세요. AI 답변과 수식 결과는 꼭 사람이 확인하세요.</p>
<div class="mbar" id="mbar" hidden>
  <button class="btn sub" id="mView" type="button">질문 보기 ↓</button>
  <button class="btn" id="mCopy" type="button">질문 복사</button>
</div>

<script id="core">
/* ===== 자료와 계산 (화면과 분리: 자동 시험에서 그대로 불러 씀) ===== */
const DEPTS=[
 {id:"common",n:"공통 업무",h:"회의록·공문·안내·민원"},
 {id:"credit",n:"신용(금융)",h:"예금·대출·연체·공제·카드"},
 {id:"mgmt",n:"경영관리",h:"총무·기획·인사·결산·조합원"},
 {id:"input",n:"구매·영농자재",h:"비료·농약·자재 재고"},
 {id:"sales",n:"판매·유통",h:"수매·출하·APC·RPC"},
 {id:"mart",n:"하나로마트·로컬푸드",h:"매장·행사·출하 농가"},
 {id:"farm",n:"농기계·육묘·방제·주유",h:"임대·공동방제·주유소"},
 {id:"live",n:"축산",h:"사료·가축시장·방역·한우"},
 {id:"guide",n:"지도·교육지원",h:"영농지도·교육·복지"},
 {id:"audit",n:"감사·준법·리스크",h:"자체감사·소비자보호·자금세탁방지"}
];
const OUTS={
 sms:{n:"안내 문자",how:"3~5문장. 인사 → 핵심 → 할 일 순서로, 휴대폰에서 읽기 쉽게"},
 notice:{n:"공지·안내문",how:"제목, 핵심 내용, 일시·장소·준비물, 문의 순서로"},
 report:{n:"보고서 초안",how:"제목, 현황, 문제점, 개선안, 건의 순서. 개조식(□ ○)으로 짧게"},
 summary:{n:"요약",how:"핵심 3줄과 해야 할 일 목록(담당·기한 칸 포함)"},
 check:{n:"체크리스트",how:"확인할 항목을 □ 표시로 10개 이내, 중요한 것부터"},
 table:{n:"표",how:"항목 · 내용 · 담당 · 기한 열이 있는 표"},
 script:{n:"응대 말씀",how:"직원이 그대로 읽을 수 있는 말 순서와, 예상 질문 3개와 답"},
 edu:{n:"설명 자료",how:"처음 듣는 사람도 이해하도록 5단계 이내 설명과 쉬운 예시"}
};
const AUDS={
 member:{n:"조합원·고객",how:"어르신도 이해하는 쉬운 말과 존댓말"},
 staff:{n:"직원·동료",how:"업무 용어는 써도 되지만 짧고 분명하게"},
 boss:{n:"상사·임원",how:"결론을 먼저, 근거는 짧게"},
 ext:{n:"외부 기관·거래처",how:"정중한 공문 말투"}
};
/* c: 어떤 결과 모양이든 지킬 사실·안전 조건, f: 특정 결과 모양에만 붙는 형식 지시 */
const T=(id,d,n,k,o,a,s,c,f)=>({id,d,n,k:k.split(","),o,a,s,c,f});
const TASKS=[
 T("c1","common","회의록 정리","회의,회의록,메모,정리","summary","staff","11월 직원 회의. 연말 행사 준비, 창구 대기 줄이기, 다음 달 교육 일정을 이야기함. 담당과 기한은 일부만 정해짐.","정해지지 않은 담당·기한은 [미정]으로 표시해 주세요."),

/* 받침에 따라 을/를 */
const eul=w=>{const c=(w||"").trim().slice(-1).charCodeAt(0);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?"을":"를"};

/* 개인정보로 보이는 것 찾기 (이름은 못 찾음) */
/* 앞뒤가 숫자가 아닐 때만 잡는다(긴 금액 속 일부를 번호로 읽지 않게) */
const okRRN=m=>{const d=m.replace(/\D/g,"");const mo=+d.slice(2,4),da=+d.slice(4,6);return mo>=1&&mo<=12&&da>=1&&da<=31};
const PII=[
 ["이메일",/[\w.+-]+@[\w-]+\.[\w.-]+/g],
 ["주민등록번호",/(?<!\d)\d{6}\s*-?\s*[1-8]\d{6}(?!\d)/g,okRRN],
 ["전화번호",/\+\s*82[\s-]*(?:\(0\)|0)?[\s-]*(?:1[016789]|2|[3-6][1-5]|70)[\s.\-)/]*\d{3,4}[\s.\-/]*\d{4}(?!\d)/g],
 ["휴대폰 번호",/(?<!\d)01[016789]\s*[-.)/]?\s*\d{3,4}\s*[-./]?\s*\d{4}(?!\d)/g],
 ["전화번호",/(?<!\d)\(?0(?:2|[3-6][1-5]|70|80|50\d)\)?\s*[-.)/]?\s*\d{3,4}\s*[-./]?\s*\d{4}(?!\d)/g],
 ["계좌·카드 번호",/(?<!\d)\d{2,6}(?:-\d{2,6}){2,4}(?!\d)/g,m=>m.replace(/\D/g,"").length>=10], /* 날짜 2026-11-09 같은 것은 통과 */
 ["계좌·카드 번호",/(?<=(?:계좌|카드|통장)(?:번호)?\s*[:：]?\s*)\d{10,16}(?!\d)/g]
];
function scrub(text){
  const found=[];let t=text||"";
  for(const [name,re,ok] of PII){
    t=t.replace(re,m=>{
      if(ok&&!ok(m)) return m;
      if(!found.includes(name)) found.push(name); return "[지움]";
    });
  }
  return {text:t,found};
}

function deptOf(id){return DEPTS.find(d=>d.id===id)}
function taskOf(id){return TASKS.find(t=>t.id===id)}

/* AI에게 보낼 질문 만들기
   질문을 다 만든 뒤 전체를 한 번에 검사해 가린다 → 화면 경고와 실제 복사 내용이 항상 같다. */
function askPrompt(o){const r=scrub(rawPrompt(o));return r}
function makePrompt(o){return askPrompt(o).text}
function rawPrompt(o){
  /* o: {task, out, aud, sit, myDept, customName} */
  const t=o.task, out=OUTS[o.out], aud=AUDS[o.aud];
  const name=t?t.n:(o.customName||"").trim()||"[업무 이름]";
  const dept=t?deptOf(t.d).n:"";
  const sit=(o.sit||"").trim()||"[상황을 한두 줄로 적어 주세요]";
  const my=(o.myDept||"").trim();
  const rules=["위 상황에 없는 숫자·날짜·금리·규정·연락처·담당자는 지어내지 말고 [확인 필요]로 표시해 주세요."];
  if(t&&t.c) rules.push(t.c);
  if(t&&t.f&&t.f[o.out]) rules.push(t.f[o.out]); /* 결과 모양에 딸린 형식 지시는 그 모양을 골랐을 때만 */
  rules.push("쉬운 말로 쓰고, 어려운 용어는 괄호 안에 풀어 주세요.");
  rules.push("다 쓴 뒤 맨 끝에 '보내기 전에 사람이 확인할 점' 3가지를 적어 주세요.");
  const work=[dept,name].filter(Boolean).join(" · ")+(my?` (우리 조합에서는 '${my}' 업무)`:"");
  return `농협 직원입니다. 아래 업무로 ${out.n}${eul(out.n)} 만들어 주세요.

[내 업무]
${work}

[상황 — 연습용 가상 사례]
${sit}

[결과 모양]
${out.n}: ${out.how}
읽는 사람: ${aud.n} — ${aud.how}

[꼭 지킬 것]
${rules.map((r,i)=>`${i+1}. ${r}`).join("\n")}

이 내용은 교육용 가상 사례입니다. 실제 고객 정보나 내부 자료는 묻지 말아 주세요.`;
}

      if(!out[g.afterOf])continue;const from=N(out[g.afterOf]);const want=out[g.sameAs]?H(N(out[g.sameAs])-1):"";
      let i=want?hdr.findIndex((s,j)=>j>=from&&H(j)===want&&!used.has(L(j+1))):-1;
      if(i<0&&H(from)&&!used.has(L(from+1)))i=from;if(i>=0){out[k]=L(i+1);used.add(L(i+1))}continue}
    const res=Array.isArray(g)?g:g.re?(Array.isArray(g.re)?g.re:[g.re]):[g];
    const lim=g.before&&out[g.before]?N(out[g.before])-1:Infinity;
    let idx=[];for(const re of res){idx=hdr.map((s,i)=>i).filter(i=>i<lim&&H(i)&&re.test(H(i))&&!used.has(L(i+1)));if(idx.length)break}
    if(g.next){ /* 바로 오른쪽 열(결과가 들어갈 열)이 '합계' 같은 제목이거나 빈 열인 것만 */
      let pick=[];for(const nr of g.next){pick=idx.filter(i=>nr===""?!H(i+1):nr.test(H(i+1)));if(pick.length)break}idx=pick}
    if(!idx.length)continue;const i=g.last?idx[idx.length-1]:idx[0];out[k]=L(i+1);used.add(L(i+1))}
  return out}

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
}

function findAll(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const words=q.split(/\s+/);
  const hit=hay=>words.every(w=>hay.includes(w));
  const r=[];
  for(const t of TASKS){const hay=[t.n,deptOf(t.d).n,...t.k].join(" ").toLowerCase();if(hit(hay))r.push({href:"#/ask/"+t.id,tag:"q",name:t.n,sub:deptOf(t.d).n})}
  for(const x of XL){const hay=[x.scene,x.sub,x.fn,"엑셀 수식 "+x.id].join(" ").toLowerCase();if(hit(hay))r.push({href:"#/xl/"+x.id,tag:"x",name:x.scene,sub:"엑셀 · "+x.fn})}
  return r;
}
function resultsHTML(list,q){
  if(!q.trim())return "";
  if(!list.length)return `<p class="muted" style="margin-top:10px">'${esc(q)}'에 맞는 업무가 없어요. <a href="#/ask/custom">업무를 직접 적어서 질문 만들기 →</a></p>`;
  return `<ul class="results">${list.slice(0,12).map(r=>`<li><a href="${r.href}"><span class="tag ${r.tag}">${r.tag==="q"?"질문":"엑셀"}</span>${esc(r.name)}<small>${esc(r.sub)}</small></a></li>`).join("")}</ul>`;
}

/* --- 예시 표 --- */
function sheetHTML(x){
  const p=x.def;const cells={...x.place(p),...(x.extra||{})};const u=x.out(p);
  const res={};for(let r=u.f;r<=u.l;r++)res[u.c+r]=x.expect[r-u.f];
  const all={...cells,...res};
  let mc=1,mr=1;for(const k of Object.keys(all)){const m=k.match(/^([A-Z]+)(\d+)$/);mc=Math.max(mc,N(m[1]));mr=Math.max(mr,+m[2])}
  let h=`<table class="sheet"><thead><tr><th></th>${Array.from({length:mc},(_,i)=>`<th>${L(i+1)}</th>`).join("")}</tr></thead><tbody>`;
  for(let r=1;r<=mr;r++){h+=`<tr><th>${r}</th>`;for(let c=1;c<=mc;c++){const k=L(c)+r;const isR=k in res;const v=isR?res[k]:(cells[k]??"");
    const num=typeof v==="number"||/^-?\d+(%|)$/.test(String(v));const hd=!isR&&typeof v==="string"&&r===1&&v!=="";
    h+=`<td class="${isR?"res ":""}${num?"nr ":""}${hd?"hd":""}">${esc(v)}</td>`}h+="</tr>"}
  return h+"</tbody></table>";
}
function tsv(x){
  const cells={...x.place(x.def),...(x.extra||{})};let mc=1,mr=1;
  for(const k of Object.keys(cells)){const m=k.match(/^([A-Z]+)(\d+)$/);mc=Math.max(mc,N(m[1]));mr=Math.max(mr,+m[2])}
  const rows=[];for(let r=1;r<=mr;r++){const a=[];for(let c=1;c<=mc;c++)a.push(cells[L(c)+r]??"");rows.push(a.join("\t"))}
  return rows.join("\n");
}

  <div class="now"><b>지금</b><span>아래 예시처럼 결과(금색 칸)가 나와요. 내 표가 다르면 2번 문장만 고치세요. 수식은 바로 바뀌어요.</span></div>

  <p style="margin:8px 0 18px"><button class="btn sub sm" id="cpTsv" type="button">예시 표 복사</button> <span class="muted">엑셀 A1 칸에 붙여 넣고 연습해 보세요. 예시 표로 연습할 때는 2번을 [예시대로 되돌리기] 상태로 두세요.</span> <span class="done" id="okT" hidden></span></p>
  <h3><span class="n">2</span> 내 표에 맞추기</h3>
  <div class="fit">${x.guess?`<div class="hdr"><label for="hdr">내 표의 제목 줄을 붙여 넣으면 열을 찾아 드려요 <span class="muted">(선택) 엑셀에서 제목 칸들을 드래그해 복사(Ctrl+C) → 여기에 붙여넣기(Ctrl+V). A열부터 복사하세요.</span></label><input id="hdr" class="t" placeholder="예: 판매일  지점  품목  수량  금액" value="${esc(S.hdrText)}" autocomplete="off"><p class="muted" id="hdrMsg" aria-live="polite"></p></div>`:""}${x.lines.map(l=>`<div class="line">${l.map(fieldHTML).join("")}</div>`).join("")}
    <p class="muted" style="margin:6px 0 0"><button class="chip" id="reset" type="button" style="font-size:14px;padding:3px 12px">예시대로 되돌리기</button></p></div>
  <h3 style="margin-top:18px"><span class="n">3</span> 수식과 넣는 방법</h3>
  <div class="out" id="out"></div>
  <details class="more"><summary>조금 다르면 AI에게 묻기</summary><div class="in">
    <label for="diff" style="font-weight:700;display:block;margin-bottom:6px">무엇이 다른가요? <span class="muted">열 위치와 조건만, 실제 자료는 빼고</span></label>
    <input class="t" id="diff" placeholder="예: 금액이 아니라 수량(D열)을 더하고 싶어요">
    <div class="warn" id="pii" hidden></div>
    <pre class="prompt" id="xp" style="border:1px solid var(--line);margin-top:10px;max-height:260px"></pre>
    <p style="margin:10px 0 0"><button class="btn sm" id="cpX" type="button">질문 복사</button> <span class="done" id="okX" hidden></span></p>
  </div></details>`;
  swipeHint();
  $("#cpTsv").onclick=async()=>{const ok=await copyText(tsv(x));flash($("#okT"),ok?"복사했어요. 엑셀 A1에 붙여 넣으세요.":"복사가 안 됐어요.")};
  const draw=()=>{
    const box=$("#out");const ms=missing();
    if(ms.length){box.innerHTML=`<div class="confirm"><b>제목 줄에서 못 찾은 칸이 있어요.</b><ul>${ms.map(k=>`<li>${esc(labelOf(k))}: <b>2번에서 직접 고르세요</b></li>`).join("")}</ul>
        <p class="muted">${x.id==="sum"?"합계를 낼 품목 이름을 적어 둔 칸(오른쪽이 비어 있는 합계표)을 고르세요. ":""}다 고르면 수식이 나와요. 다른 표의 제목 줄이면 지우고 예시대로 돌아가세요.</p><button class="chip" id="clrHdr" type="button">붙인 제목 줄 지우기</button></div>`;
      $("#clrHdr").onclick=()=>{S.hdr=[];S.hdrText="";refill();delete p._pend;viewXl(id)};drawX();return}
    const e=x.bad(p);
    if(e){box.innerHTML=`<div class="err">${esc(e)}</div>`;drawX();return}
    const nm=c=>{const s=(S.hdr[N(c)-1]||"").trim();return s?`'${esc(s)}'`:"제목 없음"};
    const uu=x.out(p);const where=`${uu.c}${uu.f}${multi(x,p)?`~${uu.c}${uu.l}`:""}`;
    if(p._pend){const ks=[];for(const l of x.lines)for(const t of l)if(typeof t==="object"&&!t.r&&!t.w)ks.push(t.k);
      box.innerHTML=`<div class="confirm"><b>제목 줄로 열을 골랐어요. 맞는지 확인해 주세요.</b><ul>${ks.map(k=>`<li>${esc(labelOf(k))}: <b>${p[k]}열</b> ${nm(p[k])}</li>`).join("")}<li>결과가 들어갈 곳: <b>${where}</b> ${nm(uu.c)}</li></ul>
        <p class="muted">틀린 곳은 2번에서 고친 뒤 누르세요. 결과 칸에는 기존 자료가 없어야 해요.</p><button class="btn sm" id="okMap" type="button">맞아요, 수식 보기</button></div>`;
      $("#okMap").onclick=()=>{p._pend=false;draw()};drawX();return}
    const cf=outConflict(x,p,S.hdr);
    if(cf&&p._ok!==uu.c){box.innerHTML=`<div class="err">${esc(cf)}<p style="margin:8px 0 0"><button class="chip" id="okCol" type="button">${uu.c}열은 비어 있어요, 계속</button> <button class="chip" id="clrHdr" type="button">붙인 제목 줄 지우기</button></p><p class="muted" style="margin:6px 0 0">다른 표에서 붙여 둔 제목 줄이면 [붙인 제목 줄 지우기]를 누르세요.</p></div>`;
      $("#okCol").onclick=()=>{p._ok=uu.c;draw()};$("#clrHdr").onclick=()=>{S.hdr=[];S.hdrText="";refill();viewXl(id)};drawX();return}
    const u=x.out(p);const r0=x.r0(p);const f=x.F(p,r0);const first=u.c+u.f;
    const many=multi(x,p);const next=many?x.F(p,r0+1):"";
    box.innerHTML=`<div class="formula"><code id="fx">${esc(f)}</code><button class="btn sm" id="cpF" type="button">수식 복사</button><span class="done" id="okF" hidden></span></div>
     <ol class="how">
      <li><b>${first}</b> 칸을 누르고 수식을 붙여 넣은 뒤 <b>Enter</b></li>
      ${!many?"":`<li>${first} 칸을 다시 누르고, 오른쪽 아래 작은 네모를 <b>${u.c}${u.l}</b>까지 끌어 내리기 (작은 네모를 두 번 눌러도 됩니다)</li>
      <li>${u.c}${u.f+1} 칸을 눌러 수식이 <code>${esc(next)}</code> 로 바뀌었는지 보기. <span class="muted">$ 붙은 범위는 그대로, 칸 이름만 한 줄씩 내려가면 맞아요.</span></li>`}
     </ol>
     ${x.note&&x.note(p)?`<div class="warn" style="margin:0 16px 12px">${esc(x.note(p))}</div>`:""}
     <div class="check"><b>맞는지 확인</b> — ${esc(x.check(p))}</div>
     ${x.alt?`<p class="alt">${esc(x.altL)}: <code>${esc(x.alt(p,r0))}</code></p>`:""}`;
    $("#cpF").onclick=async()=>{const ok=await copyText(f);flash($("#okF"),ok?"복사했어요":"복사가 안 됐어요")};
    drawX();
  };
  const drawX=()=>{const d=$("#diff").value;const e=missing().length?"열을 다 골라 주세요.":x.bad(p);
    const r=e?{text:"먼저 2번 내 표에 맞추기의 안내를 고쳐 주세요.",found:[]}:xlAsk({x,p,diff:d,hdr:S.hdr});
    $("#xp").textContent=r.text;
    const f=r.found;const w=$("#pii");w.hidden=!f.length;if(f.length)w.textContent=`${f.join(", ")}로 보이는 것을 질문에서 [지움]으로 바꿨어요(수식 속 셀 글자 포함). 엑셀에 넣을 수식은 그대로입니다.`};
  $(".fit").addEventListener("input",e=>{const el=e.target.closest("[data-k]");if(!el)return;p[el.dataset.k]=el.dataset.n?parseInt(el.value,10):el.value;draw()});
  $("#reset").onclick=()=>{Object.assign(p,x.def);delete p._pend;delete p._ok;S.hdr=[];S.hdrText="";viewXl(id)};
  const hi=$("#hdr");if(hi){const apply=()=>{S.hdrText=hi.value;S.hdr=parseHdr(hi.value);const g=guessCols(x,S.hdr);Object.assign(p,g);p._pend=Object.keys(g).length>0;delete p._ok;if(S.hdr.length){for(const k of Object.keys(x.guess))if(!g[k])p[k]=""}else refill();
      app.querySelectorAll(".fit select[data-k]").forEach(s=>{s.innerHTML=opts(p[s.dataset.k])});
      const ks=Object.keys(x.guess),got=ks.filter(k=>g[k]),miss=ks.filter(k=>!g[k]);
      $("#hdrMsg").textContent=!S.hdr.length?"":got.length?`${got.length}칸을 골랐어요. 아래 3번에서 맞는지 확인해 주세요.${miss.length?" 못 찾은 칸은 직접 골라 주세요.":""}`:"제목에서 맞는 열을 못 찾았어요. 아래에서 직접 골라 주세요.";draw()};
    hi.addEventListener("input",apply);if(S.hdr.length)$("#hdrMsg").textContent="붙여 둔 제목 줄로 열 이름을 함께 보여 드려요.";}
  $("#diff").addEventListener("input",drawX);
  $("#cpX").onclick=async()=>{const ok=await copyText($("#xp").textContent);flash($("#okX"),ok?"복사했어요. AI 대화창에 붙여 넣으세요.":"복사가 안 됐어요.")};
  draw();
}

  </div><div><div class="panel" id="panel"><div class="panelhead"><b>AI에게 보낼 질문</b><em>아직 AI의 답이 아니에요</em></div>
    <pre class="prompt" id="pr"></pre><div class="panelfoot"><button class="btn" id="cp" type="button">질문 복사</button><span class="done" id="ok" hidden></span></div></div>
    <div class="after"><h3>답을 받으면</h3><ol><li>수식을 한 칸에 먼저 넣고 결과 하나를 손으로 계산해 맞춰 보기</li><li>맞으면 아래로 채우기</li><li>안 되면 오류 메시지를 그대로 같은 대화창에 붙여 넣기</li></ol></div></div></div>`;
  const draw=()=>{const r=xlAsk({want:st.want,cols:st.cols,diff:st.diff});$("#pr").textContent=r.text;
    const f=r.found;const w=$("#pii");w.hidden=!f.length;if(f.length)w.textContent=`${f.join(", ")}로 보이는 것을 질문에서 [지움]으로 바꿨어요.`;$("#ok").hidden=true};
  [["#w1","want"],["#w2","cols"],["#w3","diff"]].forEach(([s,k])=>$(s).addEventListener("input",e=>{st[k]=e.target.value;draw()}));
  const doCopy=async()=>{const ok=await copyText($("#pr").textContent);flash($("#ok"),ok?"복사했어요. 이제 AI 대화창에 붙여 넣으세요.":"복사가 안 됐어요. 질문을 길게 눌러 직접 복사해 주세요.");return ok};
